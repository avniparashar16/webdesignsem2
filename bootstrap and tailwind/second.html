<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Basic</title>

    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>

        body{
            background-color:#f5f5f5;
            font-family:Arial, sans-serif;
        }

        .website-box{
            width:85%;
            margin:40px auto;
            border:1px solid #999;
            background:white;
        }

        .header{
            background:#3b73d9;
            color:white;
            text-align:center;
            padding:35px;
        }

        .navbar-custom{
            background:#333;
            padding:12px;
            text-align:right;
        }

        .navbar-custom a{
            color:white;
            text-decoration:none;
            margin-left:20px;
            font-size:14px;
        }

        .main-grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:30px;
            padding:40px;
        }

        .box{
            border:1px solid #ccc;
            padding:20px;
            min-height:180px;
        }

        .box h3{
            margin-bottom:10px;
        }

        
        .footer{
            background:#333;
            color:white;
            text-align:center;
            padding:15px;
            font-size:14px;
        }

        @media(max-width:768px){

            .main-grid{
                grid-template-columns:1fr;
            }

            .navbar-custom{
                text-align:center;
            }

            .website-box{
                width:95%;
            }
        }

    </style>
</head>

<body>

    <div class="website-box">

        <div class="header">
            <h1>My Website</h1>
        </div>

        <div class="navbar-custom">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>

        <div class="main-grid">

    
            <div class="box">
                <h3>Column 1</h3>

                <p>
                    This is the first column. On small devices the columns
                    stack, while on medium and larger screens they appear
                    side by side.
                </p>
            </div>

            <div class="box">
                <h3>Column 2</h3>

                <p>
                    This is the second column. Bootstrap grid system helps
                    to create responsive layouts.
                </p>
            </div>

        </div>

        <div class="footer">
        </div>

    </div>

</body>
</html>
