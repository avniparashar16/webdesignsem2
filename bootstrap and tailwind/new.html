<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Full Screen Website</title>

  
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="m-0 p-0">

  
  <div class="w-full min-h-screen bg-white">

    
    <div class="bg-gradient-to-r from-blue-700 to-indigo-700 text-white text-center py-10">
      <h1 class="text-5xl font-semibold">
        My Website
      </h1>
    </div>

    
    <div class="bg-black text-white flex justify-end gap-8 px-10 py-4 text-lg">
      <a href="#" class="hover:text-gray-300">Home</a>
      <a href="#" class="hover:text-gray-300">About</a>
      <a href="#" class="hover:text-gray-300">Services</a>
      <a href="#" class="hover:text-gray-300">Contact</a>
    </div>

    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 p-10">

      
      <div class="border border-gray-300 p-8 shadow-sm">
        <h2 class="text-4xl mb-4 font-medium">
          Column 1
        </h2>

        <p class="text-gray-700 text-lg">
          This is the first column. On small devices the columns stack,
          while on medium and larger screens they appear side by side.
        </p>
      </div>

      
      <div class="border border-gray-300 p-8 shadow-sm">
        <h2 class="text-4xl mb-4 font-medium">
          Column 2
        </h2>

        <p class="text-gray-700 text-lg">
          This is the second column. Bootstrap grid system helps to create
          responsive layouts.
        </p>
      </div>

    </div>

   
    <div class="bg-black h-10 w-full"></div>

  </div>

</body>
</html>
